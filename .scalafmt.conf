version = 3.11.5

runner.dialect = scala3

maxColumn = 200

# Preserve multiline argument lists and spaces before infix arguments.
newlines.configStyle.callSite.prefer = true
spaces.beforeInfixArgInParens = Always

docstrings.style = Asterisk
docstrings.oneline = unfold
docstrings.wrap = no

# align and indentation settings
align.preset = none
assumeStandardLibraryStripMargin = true
align.stripMargin = true
